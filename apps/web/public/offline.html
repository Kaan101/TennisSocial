<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çevrimdışı · Kort</title>
    <style>
      body { margin: 0; min-height: 100dvh; background: #f3f0e7; color: #14241c; font-family: ui-sans-serif, system-ui, sans-serif; }
      header { padding: 16px 20px 0; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #0b3d2c; font-weight: 700; }
      main { max-width: 32rem; margin: 0 auto; padding: 24px 16px 120px; }
      h1 { font-size: 1.75rem; margin: 0 0 8px; }
      p { color: #5d6b63; line-height: 1.5; }
      a.login { display: inline-block; margin-top: 16px; background: #0f6e49; color: white; text-decoration: none; border-radius: 999px; padding: 10px 16px; font-weight: 600; }
      nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fffdf8; border-top: 1px solid #e0d8c8; }
      ul { list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); max-width: 32rem; margin: 0 auto; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
      li a { display: block; text-align: center; color: #5d6b63; text-decoration: none; font-size: 11px; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>Kort</header>
    <main>
      <h1>Çevrimdışısın</h1>
      <p>Bağlantı yok. Giriş ve alt menü duruyor; maçların, profilin ve diğer kişisel veriler bu cihazda saklanmaz.</p>
      <a class="login" href="/login">Giriş sayfasına git</a>
    </main>
    <nav aria-label="Ana menü">
      <ul>
        <li><a href="/">Ana Sayfa</a></li>
        <li><a href="/oyna">Oyna</a></li>
        <li><a href="/turnuvalar">Turnuvalar</a></li>
        <li><a href="/oyuncular">Oyuncular</a></li>
        <li><a href="/profil">Profil</a></li>
      </ul>
    </nav>
  </body>
</html>
