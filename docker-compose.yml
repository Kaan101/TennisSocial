services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
      POSTGRES_DB: tennisclub
    ports:
      - "5432:5432"
    volumes:
      - tennis_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis -d tennisclub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tennis_pg:
